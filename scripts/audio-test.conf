# Private test graph: no hardware, PulseAudio, ALSA, or Bluetooth modules.
context.properties = { core.daemon = true core.name = pipewire-0 }
context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert audiotestsrc = audiotestsrc/libspa-audiotestsrc support.* = support/libspa-support }
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-access }
]
context.objects = [
    { factory = metadata args = { metadata.name = default } }
    { factory = adapter args = { factory.name = support.null-audio-sink node.name = dome.test.speakers node.description = "Test Speakers" media.class = Audio/Sink audio.position = [ FL FR ] adapter.auto-port-config = { mode = dsp monitor = true position = preserve } } }
    { factory = adapter args = { factory.name = support.null-audio-sink node.name = dome.test.headset node.description = "Test Headset" media.class = Audio/Sink audio.position = [ FL FR ] adapter.auto-port-config = { mode = dsp monitor = true position = preserve } } }
    { factory = adapter args = { factory.name = audiotestsrc node.name = dome.test.mic node.description = "Test Microphone" media.class = Audio/Source audio.position = [ MONO ] adapter.auto-port-config = { mode = dsp monitor = true position = preserve } } }
    { factory = adapter args = { factory.name = audiotestsrc node.name = dome.test.usbmic node.description = "USB Microphone" media.class = Audio/Source audio.position = [ MONO ] adapter.auto-port-config = { mode = dsp monitor = true position = preserve } } }
]
