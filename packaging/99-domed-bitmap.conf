<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <selectfont>
    <rejectfont><pattern/></rejectfont>
    <acceptfont>
      <pattern><patelt name="fontformat"><string>BDF</string></patelt><patelt name="scalable"><bool>false</bool></patelt></pattern>
      <pattern><patelt name="fontformat"><string>PCF</string></patelt><patelt name="scalable"><bool>false</bool></patelt></pattern>
    </acceptfont>
  </selectfont>
</fontconfig>
