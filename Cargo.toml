[package]
name = "dome"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Experimental shared desktop and spatial Wayland compositor"

[features]
default = []
xr = ["dep:openxr","dep:ash","dep:ureq","dep:ctrlc","dep:image"]
nested = ["dep:smithay", "dep:tracing-subscriber", "dep:bitflags", "dep:zbus"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
libloading = "0.8"
base64 = "0.22"
smithay = { version = "=0.7.0", optional = true, default-features = false, features = ["backend_winit", "wayland_frontend", "desktop"] }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
bitflags = { version = "2", optional = true }
zbus = {version="5",optional=true,default-features=false,features=["blocking-api","async-io"]}
glam = {version="0.30",features=["serde"]}
openxr = {version="0.21.1",optional=true}
ash = {version="0.38",optional=true}
ureq = {version="2.12",default-features=false,features=["json"],optional=true}
ctrlc = {version="3.4",optional=true}
image = {version="0.25",default-features=false,features=["png"],optional=true}

[build-dependencies]
cc="1"
pkg-config="0.3"

[[bin]]
name = "dome-compositor"
path = "src/bin/dome-compositor/main.rs"
required-features = ["nested"]

[[bin]]
name = "dome-preview"
path = "src/bin/dome-preview.rs"

[profile.dev]
debug = 0

[[bin]]
name="dome-xr"
path="src/bin/dome-xr.rs"
required-features=["xr"]
