[package]
name = "dome"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Experimental shared desktop and spatial Wayland compositor"

[features]
default = ["fltk"]
fltk = []
foreign-gtk = [] # optional appearance/menu bridge loaded by third-party GTK applications
xr = ["dep:openxr","dep:ash","dep:ureq","dep:ctrlc"]
nested = ["dep:async-channel", "dep:smithay", "dep:tracing-subscriber", "dep:bitflags", "dep:zbus", "dep:wayland-protocols-plasma", "dep:wayland-server", "dep:wayland-scanner"]
standalone = ["nested", "dep:calloop", "smithay/backend_drm", "smithay/backend_gbm", "smithay/backend_libinput", "smithay/backend_udev", "smithay/backend_session_libseat"]
multi-gpu = ["standalone"]
input-test-fixture = [] # Private nested-compositor integration tests only.

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
nix = { version = "0.31", features = ["socket", "uio", "user", "fs", "time"] }
async-channel = { version = "2", optional = true }
wayland-server = { version = "0.31", optional = true }
wayland-scanner = { version = "0.31", optional = true }
wayland-protocols-plasma = { version = "0.3", features = ["server"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
libloading = "0.8"
base64 = "0.22"
calloop = { version = "0.14.5", optional = true, features = ["signals"] }
smithay = { version = "=0.7.0", optional = true, default-features = false, features = ["backend_winit", "backend_gbm", "wayland_frontend", "desktop"] }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
bitflags = { version = "2", optional = true }
zbus = {version="5",optional=true,default-features=false,features=["blocking-api","async-io"]}
glam = {version="0.30",features=["serde"]}
openxr = {version="0.21.1",optional=true}
ash = {version="0.38",optional=true}
ureq = {version="2.12",default-features=false,features=["json"],optional=true}
ctrlc = {version="3.4",optional=true}
image = {version="0.25",default-features=false,features=["png"]}

[build-dependencies]
cc="1"
pkg-config="0.3"

[[bin]]
name = "dome-compositor"
path = "src/bin/dome-compositor/main.rs"
required-features = ["nested"]

[[bin]]
name = "dome-preview"
path = "src/bin/dome-preview.rs"

[profile.dev]
debug = 0

[[bin]]
name = "dome-bdf-font"
path = "src/bin/dome-bdf-font.rs"
required-features = ["nested"]

[[bin]]
name="dome-xr"
path="src/bin/dome-xr.rs"
required-features=["xr"]

[[bin]]
name = "dome-portal-picker"
path = "src/bin/dome-portal-picker.rs"
required-features = ["nested"]

[patch.crates-io]
# Preserve explicit LINEAR DMA-BUF layouts when importing into Mesa Zink.
smithay = { path = "third_party/smithay" }
